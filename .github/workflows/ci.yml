name: CI

on:
  push:
    branches: [master, scala3]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # sbt 2 keeps a machine-wide action cache that `clean` does not touch and
      # that outlives a plugin bump. Bumping sbt-scalafix moves semanticdbVersion
      # (scalafixSemanticdb.revision), but a cache hit replays compile outputs
      # built against the OLD semanticdb, so `scalafixAll --check` then reports
      # "SemanticDB not found" for every source. Start each job from a cold
      # action cache so the compiler actually runs.
      - name: Clear sbt action cache
        run: rm -rf ~/.cache/sbt/v2

      - name: Format check
        run: sbt "scalafmtCheckAll; scalafmtSbtCheck"

      - name: Compile + test
        # sbt 2 made `test` incremental (testQuick); testFull runs everything
        run: sbt "Test/compile; testFull"

      - name: Scalafix lint check
        run: sbt "scalafixAll --check"
